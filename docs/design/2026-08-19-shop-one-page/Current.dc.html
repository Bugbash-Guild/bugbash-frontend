<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #0b0f0d; font-family: 'JetBrains Mono', 'Courier New', monospace; }
    a { color: #7ee787; } a:hover { color: #a5f0ab; }
  </style>
</helmet>

<div style="width: 520px; background: #0b0f0d; color: #7a9c8c; display: flex; flex-direction: column; gap: 14px; padding: 24px;">

  <div style="font-size: 12px; color: #4a6157; letter-spacing: 0.12em;">現状の構造（スキーマ）</div>

  <!-- current IA: 4 tabs / 2 groups -->
  <div style="display: flex; flex-direction: column; gap: 8px; border: 1px dashed #2d3d37; padding: 14px;">
    <div style="font-size: 10px; color: #4a6157;">ルーンを用意する</div>
    <div style="display: flex; gap: 6px;">
      <span style="border: 1px solid #2d3d37; padding: 5px 10px; font-size: 11px;">ルーン購入</span>
      <span style="border: 1px solid #2d3d37; padding: 5px 10px; font-size: 11px;">冒険者パス</span>
    </div>
    <div style="font-size: 10px; color: #4a6157;">手持ちの資源をつかう</div>
    <div style="display: flex; gap: 6px;">
      <span style="border: 1px solid #2d3d37; padding: 5px 10px; font-size: 11px;">育成アイテム</span>
      <span style="border: 1px solid #2d3d37; padding: 5px 10px; font-size: 11px; color: #4a6157;">見た目（準備中）</span>
    </div>
  </div>

  <!-- pain points -->
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; gap: 8px; align-items: baseline;">
      <span style="color: #ff7b72; font-size: 11px;">✗</span>
      <span style="font-size: 11px; line-height: 1.6;">別ページ4枚＋グループ見出し2つ — 買い物の前に構造を学ばせている</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: baseline;">
      <span style="color: #ff7b72; font-size: 11px;">✗</span>
      <span style="font-size: 11px; line-height: 1.6;">「見た目」タブは商品0件 — 押すと空</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: baseline;">
      <span style="color: #ff7b72; font-size: 11px;">✗</span>
      <span style="font-size: 11px; line-height: 1.6;">コイン建て6種は召喚に劣後する死にSKU — 並べる価値がない</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: baseline;">
      <span style="color: #ff7b72; font-size: 11px;">✗</span>
      <span style="font-size: 11px; line-height: 1.6;">属性×サイズの2軸ピッカーが重い（18SKUの畳み込み）</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: baseline;">
      <span style="color: #ff7b72; font-size: 11px;">✗</span>
      <span style="font-size: 11px; line-height: 1.6;">各タブに purpose / cost の説明文 — 読ませすぎ</span>
    </div>
  </div>

</div>
</x-dc>
